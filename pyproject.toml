[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supernova-goal1"
version = "0.1.0"
description = "Deterministic evidence harness for Supernova Goal 1"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
